version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: hotelpro_mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hotel_management

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.raspberry
    container_name: hotelpro_backend
    restart: always
    ports:
      - "8001:8001"
    depends_on:
      - mongodb
    environment:
      MONGO_URL: mongodb://mongodb:27017
      DB_NAME: hotel_management
      CORS_ORIGINS: "*"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.raspberry
    container_name: hotelpro_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8001

volumes:
  mongodb_data:
